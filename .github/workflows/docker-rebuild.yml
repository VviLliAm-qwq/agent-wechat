name: Build agent-server binary

# Fork-local: build only the Rust agent-server and publish it as a release
# asset. Replacing the single 14 MB binary inside the existing container is
# far cheaper than moving a 3.4 GB image over a constrained link.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. paste-1)"
        required: true
        default: "paste-1"

concurrency: build-binary

permissions:
  contents: write

jobs:
  build:
    name: Build binary
    # Ubuntu 22.04 matches the container's GLIBC 2.35, so the resulting
    # binary runs there. Building on ubuntu-latest links against GLIBC 2.39.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/agent-server-rust

      - name: Build agent-server
        run: cargo build --release --manifest-path packages/agent-server-rust/Cargo.toml

      - name: Report binary
        run: ls -lh packages/agent-server-rust/target/release/agent-server

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: agent-server ${{ inputs.tag }}
          body: "Built from ${{ github.sha }} (clipboard paste for text sends)."
          files: packages/agent-server-rust/target/release/agent-server
          fail_on_unmatched_files: true
