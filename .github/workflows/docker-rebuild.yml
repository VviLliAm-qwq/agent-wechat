name: Build Image

# Fork-local simplification: build only linux/amd64 and push one tag.
# The upstream multi-arch digest/manifest dance is unnecessary here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 0.16.0-paste)"
        required: true
        default: "0.16.0-paste"
      no-cache:
        description: "Skip Docker layer cache (re-downloads WeChat)"
        type: boolean
        default: false

concurrency: build-image

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src docker/agent-server-rust/
          cp -r packages/agent-server-rust/migrations docker/agent-server-rust/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          no-cache: ${{ inputs.no-cache }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
